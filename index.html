
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Image Generator</h1>
        <input type="text" id="prompt-input" placeholder="Enter your image prompt here...">
        <button onclick="randomPrompt()">Generate Random Prompt</button>
        <button onclick="generateImage()">Generate Image</button>
        <button onclick="savePromptToURL()">Share Prompt</button>
        <div id="output-container">
            <img id="output-image" src="" alt="" />
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
