<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    input { width: 80%; padding: 10px; font-size: 1rem; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 1rem; }
    img { margin-top: 20px; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>AI Image Generator</h1>
  <input type="text" id="promptInput" placeholder="Masukkan deskripsi gambar">
  <br>
  <button onclick="generateImage()">Generate</button>
  <div id="result"></div>

  <script>
    const images = [
      'https://via.placeholder.com/512x512.png?text=Gambar+1',
      'https://via.placeholder.com/512x512.png?text=Gambar+2',
      'https://via.placeholder.com/512x512.png?text=Gambar+3',
      'https://via.placeholder.com/512x512.png?text=Gambar+4',
      'https://via.placeholder.com/512x512.png?text=Gambar+5',
    ];

    function generateImage() {
      const prompt = document.getElementById('promptInput').value;
      const resultDiv = document.getElementById('result');
      
      if (prompt === '') {
        resultDiv.innerHTML = 'Masukkan deskripsi gambar!';
        return;
      }

      const randomIndex = Math.floor(Math.random() * images.length);
      resultDiv.innerHTML = `<img src="${images[randomIndex]}" alt="Hasil Gambar AI" width="512"/>`;
    }
  </script>
</body>
</html>
