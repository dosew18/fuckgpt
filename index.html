<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    input { width: 80%; padding: 10px; font-size: 1rem; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 1rem; }
    img { margin-top: 20px; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>AI Image Generator</h1>
  <input type="text" id="promptInput" placeholder="Masukkan deskripsi gambar">
  <br>
  <button onclick="generateImage()">Generate</button>
  <div id="result"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value;
      const resultDiv = document.getElementById('result');
      
      if (prompt === '') {
        resultDiv.innerHTML = 'Masukkan deskripsi gambar!';
        return;
      }

      // API key yang diberikan
      const API_KEY = 'r8_ME6Fg34rHhIawtEJqjv0HtQSBI2WDOe1M638a';

      // URL API yang digunakan
      const url = 'https://api.replicate.com/v1/predictions';

      const headers = {
        'Authorization': `Token ${API_KEY}`,
        'Content-Type': 'application/json'
      };

      const body = JSON.stringify({
        version: "f56b3b3b3f33b3b3", // Ganti dengan versi model yang kamu pilih
        input: { prompt: prompt },
      });

      try {
        // Mengirim request ke API
        const response = await fetch(url, {
          method: 'POST',
          headers: headers,
          body: body
        });

        const data = await response.json();
        if (data && data.output) {
          // Menampilkan gambar hasil API
          const imageUrl = data.output[0];
          resultDiv.innerHTML = `<img src="${imageUrl}" alt="Generated Image" />`;
        } else {
          resultDiv.innerHTML = 'Tidak ada gambar yang dihasilkan. Coba lagi.';
        }
      } catch (error) {
        resultDiv.innerHTML = 'Terjadi kesalahan: ' + error.message;
      }
    }
  </script>
</body>
</html>
